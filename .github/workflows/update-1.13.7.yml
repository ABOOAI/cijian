          FILES

      - name: Verify application
        run: |
          npm ci
          npm test || npm test
          npm run build

      - name: Build independent recovery archives
        run: |
          mkdir -p backups/1.13.7
          find .openai .github src tests -type f | sort > /tmp/cijian-core-files.txt
          find . -maxdepth 1 -type f -printf '%P\n' | sort >> /tmp/cijian-core-files.txt
          zip -q -X backups/1.13.7/part-01-core.zip -@ < /tmp/cijian-core-files.txt
          find audio -type f | sort | zip -q -X backups/1.13.7/part-02-audio.zip -@
          find dictionary -type f | sort | zip -q -X backups/1.13.7/part-03-dictionary.zip -@
          find vendor -type f ! -path 'vendor/kokoro/model/model-q8-*.bin' | sort | zip -q -X backups/1.13.7/part-04-kokoro-runtime.zip -@
          printf '%s\n' vendor/kokoro/model/model-q8-0.bin vendor/kokoro/model/model-q8-1.bin vendor/kokoro/model/model-q8-2.bin | zip -q -0 -X backups/1.13.7/part-05-kokoro-model-a.zip -@
          printf '%s\n' vendor/kokoro/model/model-q8-3.bin vendor/kokoro/model/model-q8-4.bin vendor/kokoro/model/model-q8-5.bin | zip -q -0 -X backups/1.13.7/part-06-kokoro-model-b.zip -@
          for archive in backups/1.13.7/*.zip; do unzip -tq "$archive"; done

          for archive in backups/1.13.7/*.zip; do zipinfo -1 "$archive"; done | sort > /tmp/archive-files.txt
          find . -type f \( -path './.git/*' -o -path './backups/*' -o -path './dist/*' -o -path './node_modules/*' \) -prune -o -type f -printf '%P\n' | sort > /tmp/source-files.txt
          diff -u /tmp/source-files.txt /tmp/archive-files.txt

      - name: Write SHA-256 manifest
        run: |
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const base = 'backups/1.13.7';
          const names = fs.readdirSync(base).filter(name => name.endsWith('.zip')).sort();
          const archives = names.map(file => {
            const bytes = fs.readFileSync(path.join(base, file));
            const entries = execFileSync('zipinfo', ['-1', path.join(base, file)], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
            return { file, bytes: bytes.length, fileCount: entries.length, sha256: crypto.createHash('sha256').update(bytes).digest('hex') };
          });
          const manifest = {
            version: '1.13.7',
            generatedAt: new Date().toISOString(),
            sourceSiteCommit: '99621fe2b44fce4868d5445cb0897f75de7a6fa6',
            archiveFormat: 'zip',
            fileCount: archives.reduce((sum, item) => sum + item.fileCount, 0),
            audioMp3Count: 1049,
            archives
          };
          fs.writeFileSync(path.join(base, 'BACKUP_MANIFEST.json'), `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Commit verified 1.13.7 backup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audio vendor backups/1.13.7
          git commit -m "Complete verified Cijian 1.13.7 backup"
          git push origin HEAD:main
