name: Complete Cijian 1.13.7 backup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-1.13.7.yml

permissions:
  contents: write

jobs:
  complete-backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified binary assets
        env:
          BASE_URL: https://cijian-grade7-20261003.linwanggoo.chatgpt.site
        run: |
          while read -r expected path; do
            mkdir -p "$(dirname "$path")"
            curl --fail --location --retry 3 --retry-delay 2 \
              "$BASE_URL/$path" --output "$path"
            printf '%s  %s\n' "$expected" "$path" | sha256sum --check --strict
          done <<'FILES'
          32bdb3789bf06476c8784e262663550f1e00818b5879f1a408d90e101cd5101c  audio/letter-a.mp3
          a4883e6cbdfae4bc455adddb8e86b30da1c363909ed3c7effe4e11e49abde88d  audio/letter-b.mp3
