          df30c26e6dddc1bb5eb1604ce93102b21c6980b9c8ea8cc7d97c993b01475eaf  audio/letter-p.mp3
          dbfb7bb3229541ba28fe43e979ba33d94e3bf1dad2541347e31d909b4d23617d  audio/letter-q.mp3
          af433e932c4bf53ba1abe6a0f35c4a507fd3511ab57c429d48c7fd6cb13711ce  audio/letter-r.mp3
          e263af159aa35e5c278f90b8925b22afab23fca61473dcb1970cccbb242121ca  audio/letter-s.mp3
          1f588d092a267b6e1d2f96a0c44c224177c245c9bd57b0b8b0acaf0fce3b516e  audio/letter-t.mp3
          46f64bda6d85a7e1ff84f3d86e616df42a5ba5b06474725340bcbcedcc29603f  audio/letter-u.mp3
